language: go

go:
  - 1.21.x  # Latest stable Go version
  - master

os:
  - linux

dist: focal 
sudo: required

before_install:
  - sudo apt-get update
  #install tesseract
  - sudo apt install -y tesseract-ocr libtesseract-dev libleptonica-dev

script:
  - go test -v ./...
  - go build -v ./...

after_success:
  - bash <(curl -s https://codecov.io/bash)
